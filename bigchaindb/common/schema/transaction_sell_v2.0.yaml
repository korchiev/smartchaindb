type: object
title: Transaction Schema - SELL specific properties
required:
- asset
- metadata
- inputs
- outputs
properties:
  asset:
    properties:
      id:
        "$ref": "#/definitions/sha3_hexdigest"
      buy_offer_id:
        "$ref": "#/definitions/sha3_hexdigest"
    required:
    - id
    - buy_offer_id
  metadata:
    required:
    - seller_public_key
    - buyer_public_key
    - sale_amount
    - sale_currency
    - sale_timestamp
    properties:
      seller_public_key:
        "$ref": "#/definitions/base58"
      buyer_public_key:
        "$ref": "#/definitions/base58"
      sale_amount:
        type: number
        minimum: 0
      sale_currency:
        type: string
        minLength: 1
      sale_timestamp:
        type: string
        format: date-time
      sale_notes:
        type: string
        maxLength: 1000
  inputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/input"
  outputs:
    type: array
    minItems: 2
    maxItems: 2
    items:
      "$ref": "#/definitions/output"
