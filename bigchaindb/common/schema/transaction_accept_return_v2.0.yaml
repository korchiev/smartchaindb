type: object
title: Transaction Schema - ACCEPT_RETURN specific properties
required:
- asset
- metadata
- inputs
- outputs
properties:
  asset:
    type: object
    additionalProperties: false
    properties:
      data:
        type: object
        additionalProperties: true
        properties:
          id:
            "$ref": "#/definitions/sha3_hexdigest"
          request_return_id:
            "$ref": "#/definitions/sha3_hexdigest"
        required:
        - id
        - request_return_id
    required:
    - data
  metadata:
    required:
    - accepter_public_key
    - return_acceptance_timestamp
    - refund_details
    - return_processing_notes
    properties:
      accepter_public_key:
        "$ref": "#/definitions/base58"
      return_acceptance_timestamp:
        type: string
        format: "date-time"
      refund_details:
        type: object
        required:
        - refund_amount
        - refund_currency
        - refund_method
        properties:
          refund_amount:
            type: number
            minimum: 0
          refund_currency:
            type: string
            minLength: 1
          refund_method:
            type: string
            description: "Method used for refund (e.g., bank transfer, escrow return)"
      return_processing_notes:
        type: string
        description: "Notes about the return processing"
  inputs:
    type: array
    minItems: 1
    maxItems: 1
    items:
      "$ref": "#/definitions/input"
  outputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/output"
definitions:
  sha3_hexdigest:
    pattern: "[0-9a-f]{64}"
    type: string
  base58:
    pattern: "[1-9a-zA-Z^OIl]{43,44}"
    type: string
  input:
    type: object
    additionalProperties: false
    required:
      - owners_before
      - fulfillment
    properties:
      fulfillment:
        type: string
      fulfillment_details:
        type: object
        additionalProperties: true
      owners_before:
        type: array
        items:
          "$ref": "#/definitions/base58"
      fulfills:
        anyOf:
          - type: "null"
          - type: object
            additionalProperties: false
            required:
              - transaction_id
              - output_index
            properties:
              transaction_id:
                "$ref": "#/definitions/sha3_hexdigest"
              output_index:
                type: integer
                minimum: 0
  output:
    type: object
    additionalProperties: false
    required:
      - amount
      - condition
      - public_keys
    properties:
      amount:
        type: string
        pattern: "^[0-9]{1,20}$"
      condition:
        type: object
        additionalProperties: false
        required:
          - details
          - uri
        properties:
          details:
            type: object
            additionalProperties: true
          uri:
            type: string
            pattern: "^ni:///sha-256;([a-zA-Z0-9_-]{0,86})[?]\
              (fpt=(ed25519|threshold)-sha-256(&)?|cost=[0-9]+(&)?|\
              subtypes=ed25519-sha-256(&)?){2,3}$"
      public_keys:
        anyOf:
          - type: array
            items:
              "$ref": "#/definitions/base58"
          - type: "null"
