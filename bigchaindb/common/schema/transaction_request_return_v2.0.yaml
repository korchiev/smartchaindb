type: object
title: Transaction Schema - REQUEST_RETURN specific properties
# Envelope only. sell_transaction_id inside asset.data and all metadata
# field constraints (requester_public_key, return_reason,
# return_request_timestamp, return_policy_details) are enforced by
# REQUEST_RETURN.ttl.
required:
- asset
- metadata
- inputs
properties:
  asset:
    type: object
    additionalProperties: false
    properties:
      id:
        "$ref": "#/definitions/sha3_hexdigest"
      data:
        anyOf:
          - type: object
            additionalProperties: true
          - type: "null"
    required:
    - id
  metadata:
    type: object
    additionalProperties: true
  inputs:
    type: array
    minItems: 1
    maxItems: 1
    items:
      "$ref": "#/definitions/input"
definitions:
  sha3_hexdigest:
    pattern: "[0-9a-f]{64}"
    type: string
  base58:
    pattern: "[1-9a-zA-Z^OIl]{43,44}"
    type: string
  input:
    type: object
    required:
    - fulfills
    properties:
      owners_before:
        type: array
        items:
          "$ref": "#/definitions/base58"
      fulfillment:
        type: string
        pattern: "^[a-zA-Z0-9_-]*$"
      fulfills:
        # REQUEST_RETURN inputs may reference a prior SELL output or carry
        # no fulfillment link. SHACL enforces the cross-tx rule that, when
        # present, the referenced txid must equal asset.data.sell_transaction_id.
        anyOf:
          - type: "null"
          - type: object
            required:
            - txid
            - output
            properties:
              txid:
                type: string
              output:
                type: integer
          - type: object
            required:
            - transaction_id
            - output_index
            properties:
              transaction_id:
                type: string
              output_index:
                type: integer
