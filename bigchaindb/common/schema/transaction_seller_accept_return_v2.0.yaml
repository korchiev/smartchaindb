type: object
title: Transaction Schema - SELLER_ACCEPT_RETURN specific properties
# Envelope only. All metadata field constraints (seller_public_key,
# acceptance_timestamp, refund_details, processing_notes) and the required
# request_return_id inside asset.data are enforced by SELLER_ACCEPT_RETURN.ttl.
required:
- asset
- metadata
- inputs
properties:
  asset:
    type: object
    additionalProperties: false
    properties:
      id:
        "$ref": "#/definitions/sha3_hexdigest"
      data:
        anyOf:
          - type: object
            additionalProperties: true
          - type: "null"
    required:
    - id
  metadata:
    type: object
    additionalProperties: true
  inputs:
    type: array
    minItems: 1
    maxItems: 1
    items:
      "$ref": "#/definitions/input"
definitions:
  sha3_hexdigest:
    pattern: "[0-9a-f]{64}"
    type: string
  base58:
    pattern: "[1-9a-zA-Z^OIl]{43,44}"
    type: string
  input:
    type: object
    required:
    - owners_before
    - fulfillment
    properties:
      owners_before:
        type: array
        items:
          "$ref": "#/definitions/base58"
      fulfillment:
        type: string
        pattern: "^[a-zA-Z0-9_-]*$"
      fulfills:
        type: "null"
