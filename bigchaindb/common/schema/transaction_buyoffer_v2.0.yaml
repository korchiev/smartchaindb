type: object
title: Transaction Schema - BUY_OFFER specific properties
required:
- asset
- metadata
- inputs
- outputs
properties:
  asset:
    properties:
      id:
        "$ref": "#/definitions/sha3_hexdigest"
      advertisement_id:
        "$ref": "#/definitions/sha3_hexdigest"
    required:
    - id
    - advertisement_id
  metadata:
    required:
    - buyer_public_key
    - offer_amount
    - offer_currency
    - offer_timestamp
    - offer_expiry
    - escrow_public_key
    properties:
      buyer_public_key:
        "$ref": "#/definitions/base58"
      offer_amount:
        type: number
        minimum: 0
      offer_currency:
        type: string
        minLength: 1
      offer_timestamp:
        type: string
        format: date-time
      offer_expiry:
        type: string
        format: date-time
      escrow_public_key:
        "$ref": "#/definitions/base58"
      offer_notes:
        type: string
        maxLength: 1000
  inputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/input"
  outputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/output"
