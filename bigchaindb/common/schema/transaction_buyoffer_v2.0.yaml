type: object
title: Transaction Schema - BUY_OFFER specific properties
required:
- asset
- metadata
- inputs
- outputs
properties:
  asset:
    type: object
    additionalProperties: false
    properties:
      id:
        "$ref": "#/definitions/sha3_hexdigest"
      data:
        anyOf:
          - type: object
            additionalProperties: true
          - type: "null"
    required:
    - id
  metadata:
    required:
    - buyer_public_key
    - offer_amount
    - offer_expiry
    - escrow_public_key
    properties:
      buyer_public_key:
        "$ref": "#/definitions/base58"
      offer_amount:
        type: string
        pattern: "^[0-9]{1,20}$"
      offer_currency:
        type: string
        minLength: 1
      offer_timestamp:
        type: string
        format: date-time
      offer_expiry:
        type: string
        format: date-time
      escrow_public_key:
        "$ref": "#/definitions/base58"
      payment_asset_id:
        "$ref": "#/definitions/sha3_hexdigest"
      requestCreationTimestamp:
        type: string
      offer_notes:
        type: string
        maxLength: 1000
    additionalProperties: true
  inputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/input"
  outputs:
    type: array
    minItems: 1
    items:
      "$ref": "#/definitions/output"
