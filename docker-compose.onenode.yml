# One SmartChainDB validator on its own host.
# The Tendermint home is docker/4node/node (config + priv_validator).
# Peer list and advertised address come from docker/4node/node.env:
#   TM_PEERS=<node-id>@<private-ip>:26656,...
#   TM_EXTERNAL=<this-host-private-ip>:26656
# Usage:
#   docker compose --env-file .env --env-file docker/4node/node.env -f docker-compose.onenode.yml up -d --build

name: scdb-node

services:
  mongo:
    image: mongo:3.6
    hostname: mongo
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: mongod
    restart: always

  shacl:
    build:
      context: ./bigchaindb/backend/localshacl/shapes
      dockerfile: Dockerfile
    image: smartchaindb-shacleng
    hostname: shacl
    depends_on:
      - mongo
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DATABASE: bigchain
    volumes:
      - ./bigchaindb/backend/localshacl/shapes/shapes:/app/shapes
      - ./bigchaindb/backend/localshacl/shapes/index.js:/app/index.js
      - ./bigchaindb/backend/localshacl/shapes/transaction_graph.js:/app/transaction_graph.js
      - ./bigchaindb/backend/localshacl/shapes/state_context.js:/app/state_context.js
      - ./bigchaindb/backend/localshacl/shapes/state_validator.js:/app/state_validator.js
      - /app/node_modules
    restart: always

  bdb:
    build:
      context: .
      dockerfile: Dockerfile-dev
    image: smartchaindb-bigchaindb
    hostname: bdb
    depends_on:
      - mongo
      - shacl
    volumes:
      - ./bigchaindb:/usr/src/app/bigchaindb
      - ./tests:/usr/src/app/tests
      - ./eval:/usr/src/app/eval
      - ./setup.py:/usr/src/app/setup.py
    environment:
      BIGCHAINDB_DATABASE_BACKEND: localmongodb
      BIGCHAINDB_DATABASE_HOST: mongo
      BIGCHAINDB_DATABASE_LOGIN: ${MONGO_INITDB_ROOT_USERNAME}
      BIGCHAINDB_DATABASE_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      BIGCHAINDB_DATABASE_PORT: 27017
      BIGCHAINDB_SERVER_BIND: 0.0.0.0:9984
      BIGCHAINDB_WSSERVER_HOST: 0.0.0.0
      BIGCHAINDB_WSSERVER_ADVERTISED_HOST: bdb
      BIGCHAINDB_TENDERMINT_HOST: tm
      BIGCHAINDB_TENDERMINT_PORT: 26657
      BIGCHAINDB_ENDPOINT: bdb
      BIGCHAINDB_SERVER_WORKERS: "1"
      BIGCHAINDB_SHACL_ENABLED: ${BIGCHAINDB_SHACL_ENABLED:-true}
      BIGCHAINDB_SHACL_CACHE: ${BIGCHAINDB_SHACL_CACHE:-true}
      BIGCHAINDB_SHACL_ENDPOINT: http://shacl:3000
    ports:
      - "9984:9984"
      - "9985:9985"
    command: "bigchaindb -l INFO start"
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9984', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
